spring:
  application:
    name: mdimpresiones-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mdimpresiones}
    username: ${DB_USER:mdimpresiones}
    password: ${DB_PASSWORD:mdimpresiones}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Cordoba

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  # Origenes permitidos para el frontend (separados por coma)
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  # Carpeta donde se guardan las imagenes subidas desde el panel admin
  media-storage-path: ${MEDIA_PATH:./uploads}
  # URL publica bajo la que se sirven esas imagenes
  media-public-path: /media
  jwt:
    # EN PRODUCCION: definir JWT_SECRET (minimo 32 caracteres) como variable de entorno
    secret: ${JWT_SECRET:cambiar-este-secreto-de-desarrollo-mdimpresiones-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

logging:
  level:
    com.mdimpresiones.api: INFO
